dependencies:
  idf: ">=5.4"
  # protocol.c parses and builds JSON with it. esp-sr pulls it in too, but only for itself.
  espressif/cjson: "^1.7.19"
  espressif/esp-sr: "^2.1.5"
  # Rate conversion for the agent's TTS and our mic stream (audio_rate.c).
  espressif/esp_audio_effects: "~1.4"
  espressif/esp_codec_dev: "^1.5.1"
  espressif/esp_io_expander_tca95xx_16bit: "^2.0.1"
  espressif/esp_websocket_client: "^1.4.0"
  espressif/led_strip: "^3.0.0"
  # Finds the agent on the LAN when CONFIG_AAI_AGENT_URL is empty (discovery.c).
  espressif/mdns: "^1.8.0"
  # Wi-Fi setup from a phone when no SSID is compiled in (wifi.c).
  espressif/network_provisioning: "^1.0.0"
